#
# NUGET: Trusted publishing via NuGet/login. Secret NUGET_USER is the nuget.org profile name.
# nuget.org needs a trusted-publishing policy for THIS workflow file path
# (.github/workflows/release-stable.yml), Krypton-Suite/Standard-Toolkit, environment production.
# A policy that only lists the retired release.yml path will not authorize this workflow.
#
# MARKETPLACE: publish-templates-marketplace submits the stable templates VSIX after
# release-stable. Secret VSMARKETPLACE_PAT (Marketplace Manage) on environment production.
# VSMARKETPLACE_PRIVATE=false makes the listing public. Any other value keeps it private.

name: Release (Stable)

permissions:
  contents: write
  id-token: write

on:
  push:
    branches:
      - master
      # Replace with your own release branch if you want to trigger releases from a different branch.
      - V115
  workflow_dispatch:

jobs:
  release-stable:
    runs-on: windows-2025-vs2026
    environment: production  # Requires approval before publishing
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    outputs:
      templates_tag: ${{ steps.publish_templates.outputs.tag }}

    steps:
      # Release kill switch
      - name: Release Kill Switch Check
        id: release_kill_switch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $disabled = '${{ vars.RELEASE_DISABLED }}'

          if ($disabled -eq 'true') {
            Write-Host "::warning:: Release workflow is currently DISABLED via kill switch (RELEASE_DISABLED=true)"
            Write-Host "To re-enable: Go to Repository Settings -> Secrets and Variables -> Actions -> Variables -> Set RELEASE_DISABLED to 'false'."
            echo "enabled=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Release kill switch check has passed, continuing..."
            echo "enabled=true" >> $env:GITHUB_OUTPUT
          }

      - name: Checkout
        # Kill switch check
        if: steps.release_kill_switch.outputs.enabled == 'true'
        uses: actions/checkout@v7

      - name: Resolve Krypton source paths
        id: source_paths
        if: steps.release_kill_switch.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $componentsRoot = 'Source/Krypton Components'
          $solution = Join-Path $componentsRoot 'Krypton Toolkit Suite 2022 - VS2022.slnx'
          if (-not (Test-Path -LiteralPath $solution)) { throw "Krypton Components solution not found: $solution" }
          $toolkitProject = @(
            (Join-Path $componentsRoot 'Core/Krypton.Toolkit/Krypton.Toolkit 2022.csproj'),
            (Join-Path $componentsRoot 'Krypton.Toolkit/Krypton.Toolkit 2022.csproj')
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $toolkitProject) { throw "Krypton.Toolkit project not found under $componentsRoot." }
          $utilitiesProject = @(
            (Join-Path $componentsRoot 'Utilities/Krypton.Toolkit.Utilities/Krypton.Toolkit.Utilities.csproj'),
            (Join-Path $componentsRoot 'Krypton.Toolkit.Utilities/Krypton.Toolkit.Utilities.csproj')
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          "components_root=$componentsRoot" >> $env:GITHUB_OUTPUT
          "toolkit_project=$toolkitProject" >> $env:GITHUB_OUTPUT
          "utilities_project=$utilitiesProject" >> $env:GITHUB_OUTPUT

      # .NET 10 required; .NET 11 with preview fallback (NETSDK1045 if only 10.x is selected). .NET 12 when USE_DOTNET_PREVIEW != false.
      - name: Setup .NET (10 and 11)
        # Kill switch check
        if: steps.release_kill_switch.outputs.enabled == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Setup .NET Preview (stable)
        id: setup_dotnetpreview_stable_master
        continue-on-error: true
        # Kill switch + USE_DOTNET_PREVIEW=false skips next-band (.NET 12) install
        if: steps.release_kill_switch.outputs.enabled == 'true' && vars.USE_DOTNET_PREVIEW != 'false'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ vars.DOTNET_PREVIEW_SETUP_VERSION != '' && vars.DOTNET_PREVIEW_SETUP_VERSION || '12.0.x' }}

      - name: Setup .NET Preview (preview fallback)
        # Kill switch + USE_DOTNET_PREVIEW=false skips next-band (.NET 12) install
        if: steps.release_kill_switch.outputs.enabled == 'true' && vars.USE_DOTNET_PREVIEW != 'false' && steps.setup_dotnetpreview_stable_master.outcome == 'failure'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ vars.DOTNET_PREVIEW_SETUP_VERSION != '' && vars.DOTNET_PREVIEW_SETUP_VERSION || '12.0.x' }}
          dotnet-quality: preview

      # Preview .NET SDK. USE_DOTNET_PREVIEW=false skips next-band (.NET 12) and preview SDK; global.json uses stable SDK below.
      - name: Setup .NET Preview
        # Kill switch check
        if: steps.release_kill_switch.outputs.enabled == 'true' && vars.USE_DOTNET_PREVIEW != 'false'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ vars.DOTNET_PREVIEW_SETUP_VERSION }}
          dotnet-quality: preview

      # Pin sdk.version for CI; preview band vs stable follows USE_DOTNET_PREVIEW; always allow .NET 12 for net12.0-windows TFMs.
      - name: Pin SDK via global.json
        if: steps.release_kill_switch.outputs.enabled == 'true'
        env:
          DOTNET_PREVIEW_SDK_BAND: ${{ vars.DOTNET_PREVIEW_SDK_BAND }}
          USE_DOTNET_PREVIEW: ${{ vars.USE_DOTNET_PREVIEW }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-ListedSdkVersion([string]$Pattern) {
            $hit = dotnet --list-sdks | Select-String $Pattern | Select-Object -Last 1
            if (-not $hit) { return $null }
            $line = $hit.Line.TrimEnd()
            if ($line -match '^(\d+\.\d+\.\d+)\s') { return $Matches[1] }
            return (($line -split '\s+', 2)[0])
          }

          $usePreview = $env:USE_DOTNET_PREVIEW -ne 'false'
          $sdkVersion = $null
          if (-not $usePreview) {
            $sdkVersion = Get-ListedSdkVersion '12.0'
            if (-not $sdkVersion) { $sdkVersion = Get-ListedSdkVersion '11.0' }
            if (-not $sdkVersion) { $sdkVersion = Get-ListedSdkVersion '10.0' }
          } else {
            if (-not $env:DOTNET_PREVIEW_SDK_BAND) {
              Write-Error 'DOTNET_PREVIEW_SDK_BAND is not set (repository variable).'
            }
            $sdkVersion = Get-ListedSdkVersion $env:DOTNET_PREVIEW_SDK_BAND
            if (-not $sdkVersion) {
              $sdkVersion = Get-ListedSdkVersion '12.0'
            }
            if (-not $sdkVersion) {
              $sdkVersion = Get-ListedSdkVersion '11.0'
            }
            if (-not $sdkVersion) {
              $sdkVersion = Get-ListedSdkVersion '10.0'
            }
          }
          if (-not $sdkVersion) {
            Write-Error 'Could not resolve an SDK version for global.json.'
          }
          if ($sdkVersion -notmatch '^(1[1-9]|[2-9]\d)\.') {
            Write-Error "Pinned SDK $sdkVersion cannot target net11.0-windows. Install/select .NET 11+ before build."
          }
          Write-Host "Using SDK $sdkVersion"
          @"
          {
            "sdk": {
              "version": "$sdkVersion",
              "rollForward": "latestFeature"
            }
          }
          "@ | Out-File -Encoding utf8 global.json

      - name: Setup MSBuild
        # Kill switch check
        if: steps.release_kill_switch.outputs.enabled == 'true'
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Setup NuGet
        # Kill switch check
        if: steps.release_kill_switch.outputs.enabled == 'true'
        uses: NuGet/setup-nuget@v4

      - name: Cache NuGet
        # Kill switch check
        if: steps.release_kill_switch.outputs.enabled == 'true'
        id: nuget_cache_restore
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve Krypton toolkit major version
        if: steps.release_kill_switch.outputs.enabled == 'true'
        id: krypton_major_version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          . (Join-Path $repoRoot 'Scripts/CI/Test-KryptonInteropInPackages.ps1')
          $major = Get-KryptonToolkitMajorVersion -Configuration Release
          echo "major=$major" >> $env:GITHUB_OUTPUT

      - name: Populate WebView2 (Latest)
        # Kill switch check; WEBVIEW2_MINIMUM_SUPPORTED_VERSION defaults to 110 when unset
        if: steps.release_kill_switch.outputs.enabled == 'true' && steps.krypton_major_version.outputs.major >= (vars.WEBVIEW2_MINIMUM_SUPPORTED_VERSION || 110)
        shell: pwsh
        run: |
          $utilProj = '${{ steps.source_paths.outputs.utilities_project }}'
          $libDir = Join-Path (Split-Path -Parent $utilProj) 'Lib\WebView2'
          if (-not (Test-Path $utilProj)) { Write-Error "Project not found: $utilProj"; exit 1 }
          if (-not (Test-Path $libDir)) { New-Item -ItemType Directory -Path $libDir -Force }
          $packageId = "Microsoft.Web.WebView2"
          $latestVersion = $null
          try {
            $searchResponse = Invoke-RestMethod -Uri "https://azuresearch-usnc.nuget.org/query?q=$packageId&prerelease=false&semVerLevel=2.0.0&take=1" -Method Get
            if ($searchResponse.data -and $searchResponse.data.Count -gt 0) { $latestVersion = $searchResponse.data[0].version }
          } catch {
            try {
              $response = Invoke-RestMethod -Uri "https://api.nuget.org/v3-flatcontainer/$packageId/index.json" -Method Get
              $stableVersions = $response.versions | Where-Object { $_ -notmatch '[-]' -and $_ -match '^\d+\.\d+\.\d+$' }
              if ($stableVersions) { $latestVersion = $stableVersions | Sort-Object { [System.Version]$_ } -Descending | Select-Object -First 1 }
            } catch {}
          }
          if (-not $latestVersion) { $latestVersion = "1.0.3595.46" }
          Write-Host "Using WebView2 (Latest): $latestVersion"
          dotnet add "$utilProj" package $packageId --version $latestVersion
          dotnet restore "$utilProj"
          $nugetBase = Join-Path $env:USERPROFILE ".nuget\packages\microsoft.web.webview2\$latestVersion"
          @("Microsoft.Web.WebView2.Core.dll","Microsoft.Web.WebView2.WinForms.dll","WebView2Loader.dll") | ForEach-Object {
            $f = Get-ChildItem -Path $nugetBase -Recurse -Name $_ -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($f) { Copy-Item (Join-Path $nugetBase $f) $libDir -Force; Write-Host "Copied $_" }
          }
          [xml]$proj = Get-Content $utilProj
          $nodes = $proj.SelectNodes("//PackageReference[@Include='$packageId']")
          foreach ($node in $nodes) { $node.ParentNode.RemoveChild($node) | Out-Null }
          $proj.Save($utilProj)
          Write-Host "Removed temporary WebView2 PackageReference entries"

      - name: Restore
        # Kill switch check
        if: steps.release_kill_switch.outputs.enabled == 'true'
        run: dotnet restore "Source/Krypton Components/Krypton Toolkit Suite 2022 - VS2022.slnx" -p:Configuration=Release -p:TFMs=all

      # /m: multi-processor MSBuild (all runner CPUs). build.proj orchestrates Krypton.* in parallel where references allow.
      - name: Build Release
        # Kill switch check
        if: steps.release_kill_switch.outputs.enabled == 'true'
        run: msbuild /m "Scripts/Build/build.proj" /t:Build /restore /p:Configuration=Release /p:Platform="Any CPU" /p:UseArtifactsOutput=true

      - name: Pack Release
        # Kill switch check
        if: steps.release_kill_switch.outputs.enabled == 'true'
        run: msbuild /m "Scripts/Build/build.proj" /t:Pack /restore /p:Configuration=Release /p:Platform="Any CPU" /p:UseArtifactsOutput=true

      # Verify Krypton.Interop is present in NuGet packages (V110+ only; major resolved earlier for WebView2 gate)
      - name: Verify Krypton.Interop in NuGet packages
        if: steps.release_kill_switch.outputs.enabled == 'true' && steps.krypton_major_version.outputs.major >= 110
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          . (Join-Path $repoRoot 'Scripts/CI/Test-KryptonInteropInPackages.ps1')
          Test-KryptonInteropInPackages -Configuration Release -MinimumMajorVersion 110 -SkipIfInteropProjectMissing

      - name: Verify WinForms Designer SDK in NuGet packages
        if: steps.release_kill_switch.outputs.enabled == 'true' && steps.krypton_major_version.outputs.major >= 110
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          . (Join-Path $repoRoot 'Scripts/CI/Test-KryptonDesignerSdkInPackages.ps1')
          Test-KryptonDesignerSdkInPackages -Configuration Release -MinimumMajorVersion 110 -SkipIfDesignerSdkProjectMissing

      - name: Save NuGet cache
        # Kill switch check
        if: success() && steps.release_kill_switch.outputs.enabled == 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget_cache_restore.outputs.cache-primary-key }}

      - name: NuGet login (OIDC)
        # Kill switch check
        if: steps.release_kill_switch.outputs.enabled == 'true' && github.repository == 'Krypton-Suite/Standard-Toolkit'
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push NuGet Packages to nuget.org
        # Kill switch check
        if: steps.release_kill_switch.outputs.enabled == 'true'
        id: push_nuget
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'Krypton-Suite/Standard-Toolkit') {
            Write-Warning "NuGet trusted publishing is only configured for Krypton-Suite/Standard-Toolkit - skipping NuGet push"
            echo "packages_published=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if (-not $env:NUGET_API_KEY) {
            Write-Error "NuGet trusted publishing did not provide an API key. Set the NUGET_USER secret to the nuget.org profile name."
            exit 1
          }

          $packageCandidates = @(
            "artifacts/packages/Release/*.nupkg",
            "Bin/Packages/Release/*.nupkg"
          )
          $packages = @(Get-ChildItem -Path $packageCandidates -ErrorAction SilentlyContinue | Sort-Object FullName -Unique)
          $publishedAny = $false
          $repoRoot = if ($null -ne $env:GITHUB_WORKSPACE -and $env:GITHUB_WORKSPACE -ne '') { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          . (Join-Path $repoRoot 'Scripts/CI/StandardToolkitNupkgGuard.ps1')
          $standardToolkitNupkgSizeGateFailed = $false

          if ($packages) {
            foreach ($package in $packages) {
              if (-not (Test-StandardToolkitNupkgPushAllowed -Package $package)) {
                $standardToolkitNupkgSizeGateFailed = $true
                continue
              }
              Write-Output "Pushing package: $($package.Name)"
              try {
                $output = dotnet nuget push "$($package.FullName)" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate 2>&1 | Out-String
                Write-Output $output
                # Check if package was actually pushed (not skipped)
                if ($output -notmatch "already exists" -and $output -notmatch "was not pushed") {
                  $publishedAny = $true
                  Write-Host "Package $($package.Name) was published"
                } else {
                  Write-Host "Package $($package.Name) already exists - skipped"
                }
              } catch {
                Write-Warning "Failed to push $($package.Name): $_"
              }
            }
          } else {
            Write-Output "No NuGet packages found to push"
          }

          if ($standardToolkitNupkgSizeGateFailed) {
            exit 1
          }

          echo "packages_published=$publishedAny" >> $env:GITHUB_OUTPUT
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          STANDARD_TOOLKIT_MIN_NUPKG_MB: ${{ vars.STANDARD_TOOLKIT_MIN_NUPKG_MB }}

      - name: Get Version
        # Kill switch check
        if: steps.release_kill_switch.outputs.enabled == 'true'
        id: get_version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $null
          $proj = '${{ steps.source_paths.outputs.toolkit_project }}'
          $msbuildConfig = 'Release'

          try {
            $evaluated = (& dotnet msbuild "$proj" -getProperty:Version -p:Configuration=$msbuildConfig -nologo -v:q).Trim()
            if ($evaluated) {
              if ($evaluated -match '^[1-9]\d{2,}\.\d+\.\d+\.\d+$') {
                $version = $evaluated
                Write-Host "Got version from MSBuild: $version"
              } else {
                Write-Warning "Ignoring unexpected MSBuild version '$evaluated'."
              }
            }
          } catch {
            Write-Host "Could not read version from MSBuild: $_"
          }

          if (-not $version) {
            try {
              $dllRelativePaths = @(
                "artifacts/bin/$msbuildConfig/net48/Krypton.Toolkit.dll",
                "Bin/$msbuildConfig/net48/Krypton.Toolkit.dll"
              )
              $dllPath = $null
              foreach ($p in $dllRelativePaths) {
                if (Test-Path -LiteralPath $p) { $dllPath = Get-Item -LiteralPath $p; break }
              }
              if (-not $dllPath) { throw "Krypton.Toolkit.dll not found under artifacts or Bin." }
              $assemblyVersion = [System.Reflection.AssemblyName]::GetAssemblyName($dllPath.FullName).Version
              $assemblyVersionText = $assemblyVersion.ToString()
              if ($assemblyVersionText -match '^[1-9]\d{2,}\.\d+\.\d+\.\d+$') {
                $version = $assemblyVersionText
                Write-Host "Got version from assembly: $version"
              } else {
                Write-Warning "Ignoring unexpected assembly version '$assemblyVersionText' from $($dllPath.FullName)."
              }
            } catch {
              Write-Host "Could not read version from assembly: $_"
            }
          }

          if (-not $version) {
            Write-Warning "Version not found, using fallback."
            $version = vars.FALLBACK_LTS_VERSION
          }

          Write-Host "Final determined version: $version"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Publish Visual Studio templates
        id: publish_templates
        if: steps.release_kill_switch.outputs.enabled == 'true' && steps.push_nuget.outputs.packages_published == 'True'
        uses: ./.github/actions/publish-templates
        with:
          channel: stable
          source-branch: master
          release-disabled: ${{ vars.TEMPLATES_RELEASE_DISABLED }}

      - name: Announce Release on Discord
        # Kill switch check
        if: steps.release_kill_switch.outputs.enabled == 'true' && steps.push_nuget.outputs.packages_published == 'True'
        shell: pwsh
        run: |
          if (-not $env:DISCORD_STABLE_ANNOUNCEMENT_WEBHOOK) {
            Write-Warning "DISCORD_STABLE_ANNOUNCEMENT_WEBHOOK not set - skipping Discord notification"
            exit 0
          }

          $sha = (git rev-parse HEAD).Trim()
          $shortSha = $sha.Substring(0, [Math]::Min(7, $sha.Length))
          $commitUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/commit/$sha"
          $templatesUrl = '${{ steps.publish_templates.outputs.release_url }}'.Trim()
          if ([string]::IsNullOrWhiteSpace($templatesUrl)) {
            $templatesUrl = (& "$env:GITHUB_WORKSPACE/Scripts/CI/Get-TemplatesReleaseUrl.ps1" -Channel 'stable' | Select-Object -Last 1).ToString().Trim()
          }

          $payload = @{
            embeds = @(
              @{
                title = "ðŸŽ‰ Krypton Toolkit Stable Release"
                url = $commitUrl
                description = "A new stable release is now available!"
                color = 7863670
                fields = @(
                  @{
                    name = "ðŸ“Œ Version"
                    value = "``${{ steps.get_version.outputs.version }}``"
                    inline = $true
                  }
                  @{
                    name = "ðŸ”— Commit"
                    value = "[``$shortSha``]($commitUrl)"
                    inline = $true
                  }
                  @{
                    name = "ðŸ“¦ NuGet Packages"
                    value = "â€¢ [Krypton.Toolkit](https://www.nuget.org/packages/Krypton.Toolkit)`nâ€¢ [Krypton.Themes](https://www.nuget.org/packages/Krypton.Themes)`nâ€¢ [Krypton.Ribbon](https://www.nuget.org/packages/Krypton.Ribbon)`nâ€¢ [Krypton.Navigator](https://www.nuget.org/packages/Krypton.Navigator)`nâ€¢ [Krypton.Workspace](https://www.nuget.org/packages/Krypton.Workspace)`nâ€¢ [Krypton.Docking](https://www.nuget.org/packages/Krypton.Docking)`nâ€¢ [Krypton.Standard.Toolkit](https://www.nuget.org/packages/Krypton.Standard.Toolkit)"
                    inline = $false
                  }
                  @{
                    name = "ðŸ§© Visual Studio Templates"
                    value = "[Latest templates release]($templatesUrl)"
                    inline = $false
                  }
                  @{
                    name = "ðŸŽ¯ Target Frameworks"
                    value = "â€¢ .NET Framework 4.7.2`nâ€¢ .NET Framework 4.8`nâ€¢ .NET Framework 4.8.1`nâ€¢ .NET 10.0`nâ€¢ .NET 11.0"
                    inline = $false
                  }
                  @{
                    name = "ðŸ“„ Release Notes"
                    value = "[View Changelog](https://github.com/Krypton-Suite/Standard-Toolkit/blob/master/Documents/Changelog/Changelog.md)"
                    inline = $false
                  }
                )
                footer = @{
                  text = "Released"
                }
                timestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
              }
            )
          } | ConvertTo-Json -Depth 10

          Invoke-RestMethod -Uri "${{ secrets.DISCORD_STABLE_ANNOUNCEMENT_WEBHOOK }}" -Method Post -Body $payload -ContentType "application/json"
        env:
          DISCORD_STABLE_ANNOUNCEMENT_WEBHOOK: ${{ secrets.DISCORD_STABLE_ANNOUNCEMENT_WEBHOOK }}

  publish-templates-marketplace:
    needs: release-stable
    if: needs.release-stable.result == 'success' && needs.release-stable.outputs.templates_tag != ''
    runs-on: windows-2025-vs2026
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download stable templates VSIX
        uses: actions/download-artifact@v8
        with:
          name: templates-stable
          path: artifacts/templates

      - name: Publish VSIX to the Visual Studio Marketplace
        shell: pwsh
        env:
          VSMARKETPLACE_PAT: ${{ secrets.VSMARKETPLACE_PAT }}
          VSMARKETPLACE_PRIVATE: ${{ vars.VSMARKETPLACE_PRIVATE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vsix = Get-ChildItem -Path "artifacts\templates" -Filter *.vsix -Recurse -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $vsix) { throw "Stable templates artifact did not contain a VSIX." }
          & "$env:GITHUB_WORKSPACE/Scripts/CI/Publish-TemplatesMarketplace.ps1" `
            -VsixPath $vsix.FullName `
            -RepoRoot $env:GITHUB_WORKSPACE
