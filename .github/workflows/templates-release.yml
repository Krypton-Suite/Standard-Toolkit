#
# KILL-SWITCH: To disable template publishing, set repository variable TEMPLATES_RELEASE_DISABLED=true
# Location: Repository Settings -> Secrets and variables -> Actions -> Variables tab
# To re-enable: Set TEMPLATES_RELEASE_DISABLED=false or delete the variable
#
# Stable, canary, alpha, and release-candidate templates publish from the matching
# package workflow after NuGet publish:
#   stable -> .github/workflows/release.yml (master)
#   canary -> .github/workflows/canary.yml and release.yml (canary)
#   alpha  -> .github/workflows/nightly.yml
#   rc     -> .github/workflows/release-candidate.yml
# This workflow publishes the V110 "current" channel, and can be run manually.

name: Visual Studio Templates Release

on:
  push:
    branches:
      - V110
    paths:
      - "Templates/**"
      - "Scripts/CI/Apply-TemplatesNuGetPackage.ps1"
      - ".github/workflows/templates-release.yml"
      - ".github/actions/publish-templates/action.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-templates:
    runs-on: windows-2025-vs2026
    environment: production

    steps:
      - name: Visual Studio Templates Release Kill Switch Check
        id: templates_release_kill_switch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $disabled = '${{ vars.TEMPLATES_RELEASE_DISABLED }}'

          if ($disabled -eq 'true') {
            Write-Host "::warning:: Visual Studio Templates release workflow is currently DISABLED via kill switch (TEMPLATES_RELEASE_DISABLED=true)"
            Write-Host "To re-enable: set TEMPLATES_RELEASE_DISABLED to 'false' or remove the variable."
            echo "enabled=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Visual Studio Templates release kill switch check has passed, continuing..."
            echo "enabled=true" >> $env:GITHUB_OUTPUT
          }

      - name: Checkout
        if: steps.templates_release_kill_switch.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve Visual Studio Templates release channel
        if: steps.templates_release_kill_switch.outputs.enabled == 'true'
        id: channel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $branch = "${{ github.ref_name }}"

          switch ($branch) {
            'master' { $channel = 'stable' }
            'canary' { $channel = 'canary' }
            'Canary' { $channel = 'canary' }
            'gold' { $channel = 'rc' }
            'alpha' { $channel = 'alpha' }
            'V110' { $channel = 'current' }
            default { throw "No templates channel for branch '$branch'. Run this workflow from master, canary, gold, alpha, or V110." }
          }

          echo "branch=$branch" >> $env:GITHUB_OUTPUT
          echo "channel=$channel" >> $env:GITHUB_OUTPUT

      - name: Publish Visual Studio templates
        if: steps.templates_release_kill_switch.outputs.enabled == 'true'
        uses: ./.github/actions/publish-templates
        with:
          channel: ${{ steps.channel.outputs.channel }}
          source-branch: ${{ steps.channel.outputs.branch }}
          release-disabled: ${{ vars.TEMPLATES_RELEASE_DISABLED }}
