#
# Checks touchscreen detection and scale factors, then compares preferred size
# with touch support forced on and font scaling off. Fails when a failure key is
# not already listed in Scripts/TouchAudit/baseline.json, or when a touch hard check fails.
# A runner without a digitizer is not a failure.
#
# KILL-SWITCH: Set repository variable TOUCHSCREEN_CHECK_DISABLED=true to skip.
#
# Local run: see Source/TestHarnesses/AccessibilityAudit/README.md.

name: Touchscreen audit

permissions:
  contents: read

concurrency:
  group: touch-audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened]
    paths:
      - 'Source/Krypton Components/**'
      - 'Source/TestHarnesses/AccessibilityAudit/**'
      - 'Scripts/TouchAudit/**'
      - '.github/workflows/touch-audit.yml'
  push:
    branches:
      - master
      - alpha
      - canary
      - gold
      - V115
    paths:
      - 'Source/Krypton Components/**'
      - 'Source/TestHarnesses/AccessibilityAudit/**'
      - 'Scripts/TouchAudit/**'
      - '.github/workflows/touch-audit.yml'

jobs:
  touch:
    name: Touchscreen sizing
    runs-on: windows-2025-vs2026
    # Always allow workflow_dispatch; block only fork pull_request runs.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Touchscreen check kill switch
        id: kill_switch
        shell: pwsh
        env:
          TOUCHSCREEN_CHECK_DISABLED: ${{ vars.TOUCHSCREEN_CHECK_DISABLED }}
        run: |
          if ($env:TOUCHSCREEN_CHECK_DISABLED -eq 'true') {
            Write-Host '::warning:: Touchscreen check is DISABLED (TOUCHSCREEN_CHECK_DISABLED=true).'
            "enabled=false" >> $env:GITHUB_OUTPUT
          }
          else {
            "enabled=true" >> $env:GITHUB_OUTPUT
          }

      - name: Checkout
        if: steps.kill_switch.outputs.enabled == 'true'
        uses: actions/checkout@v7

      - name: Setup .NET (10)
        if: steps.kill_switch.outputs.enabled == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Setup .NET (11)
        if: steps.kill_switch.outputs.enabled == 'true'
        id: setup_dotnet11_touch
        continue-on-error: true
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Setup .NET (11 preview fallback)
        if: steps.kill_switch.outputs.enabled == 'true' && steps.setup_dotnet11_touch.outcome == 'failure'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      # Toolkit graphs include net12.0-windows when USE_DOTNET_PREVIEW != false; restore needs a 12.x SDK (NETSDK1045 otherwise).
      - name: Setup .NET Preview
        id: setup_dotnetpreview
        continue-on-error: true
        if: steps.kill_switch.outputs.enabled == 'true' && vars.USE_DOTNET_PREVIEW != 'false'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ vars.DOTNET_PREVIEW_SETUP_VERSION != '' && vars.DOTNET_PREVIEW_SETUP_VERSION || '12.0.x' }}

      - name: Setup .NET Preview (preview fallback)
        if: steps.kill_switch.outputs.enabled == 'true' && vars.USE_DOTNET_PREVIEW != 'false' && steps.setup_dotnetpreview.outcome == 'failure'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ vars.DOTNET_PREVIEW_SETUP_VERSION != '' && vars.DOTNET_PREVIEW_SETUP_VERSION || '12.0.x' }}
          dotnet-quality: preview

      - name: Restore AccessibilityAudit
        if: steps.kill_switch.outputs.enabled == 'true'
        run: >
          dotnet restore "Source/TestHarnesses/AccessibilityAudit/AccessibilityAudit.csproj"
          -p:Configuration=Debug

      - name: Build AccessibilityAudit
        if: steps.kill_switch.outputs.enabled == 'true'
        run: >
          dotnet build "Source/TestHarnesses/AccessibilityAudit/AccessibilityAudit.csproj"
          -c Debug
          -f net10.0-windows
          --no-restore
          -m:1
          -p:BuildInParallel=false

      - name: Run touchscreen audit
        id: audit
        if: steps.kill_switch.outputs.enabled == 'true'
        shell: pwsh
        env:
          KRYPTON_HEADLESS: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'Source\TestHarnesses\AccessibilityAudit\bin\Debug\net10.0-windows\AccessibilityAudit.exe'
          $baseline = Join-Path $env:GITHUB_WORKSPACE 'Scripts\TouchAudit\baseline.json'
          $report = Join-Path $env:GITHUB_WORKSPACE 'touch-report.md'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Expected AccessibilityAudit.exe at $exe"
          }
          if (-not (Test-Path -LiteralPath $baseline)) {
            throw "Expected baseline at $baseline"
          }

          # WinExe is not waited on by the call operator, so take the exit code from Start-Process.
          $audit = Start-Process -FilePath $exe -ArgumentList @('--suite', 'touch', '--baseline', $baseline, '--report', $report) -WorkingDirectory $env:GITHUB_WORKSPACE -Wait -PassThru
          if ($audit.ExitCode -ne 0) {
            Write-Host "[FAIL] AccessibilityAudit.exe exited $($audit.ExitCode)"
            exit $audit.ExitCode
          }

          Write-Host '[PASS] AccessibilityAudit.exe completed successfully'

      - name: Upload touchscreen report
        if: always() && steps.kill_switch.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: touch-report
          path: touch-report.md
          if-no-files-found: warn
